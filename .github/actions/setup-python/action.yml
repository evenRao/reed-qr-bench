name: Install locked Python environment
description: Install uv and synchronize the selected supported Python version.
inputs:
  python-version:
    description: CPython version
    default: "3.14"
  only-dev:
    description: Install only lint and test tooling
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.6"
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-suffix: ${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-${{ inputs.only-dev }}
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
          packages/reed-qr-tools/pyproject.toml
    - name: Synchronize dependencies
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        ONLY_DEV: ${{ inputs.only-dev }}
      run: |
        if [ "$ONLY_DEV" = true ]; then
          uv sync --locked --only-dev --python "$PYTHON_VERSION"
        else
          uv sync --locked --extra voice --python "$PYTHON_VERSION"
        fi
