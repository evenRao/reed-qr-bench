[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reed-qr-tools"
version = "0.2.0"
description = "Embeddable, provider-neutral QR operations using the public REED QR SDK"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = ["reed-qr==0.1.0"]

[project.optional-dependencies]
livekit = ["reed-qr[livekit]==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/reed_qr_tools"]
